name: API Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Node.js 설치
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Smoke 테스트 실행
        run: npm run test:smoke

      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: |
            reports/smoke.html
            reports/smoke.json
            reports/smoke-retry.*

  regression:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Node.js 설치
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Regression 테스트 실행
        run: npm run test:regression

      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report
          path: |
            reports/regression.html
            reports/regression.json
            reports/regression-retry.*

  data:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Node.js 설치
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 데이터 기반 테스트 실행
        run: npm run test:data

      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-report
          path: |
            reports/data.html
            reports/data.json
            reports/data-retry.*

  data-patch:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Node.js 설치
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: PATCH 데이터 기반 테스트 실행
        run: npm run test:data-patch

      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-patch-report
          path: |
            reports/data-patch.html
            reports/data-patch.json
            reports/data-patch-retry.*
