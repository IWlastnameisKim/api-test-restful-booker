name: API Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Node.js 설치
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: API 테스트 실행
        run: npm run test:api

      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-report
          path: reports/report.html