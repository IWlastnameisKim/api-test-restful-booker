name: API Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: API 테스트 실행
        run: npx newman run collections/Restful-booker.postman_collection.json -e env/restful-booker.postman_environment.json -r cli,htmlextra --reporter-htmlextra-export reports/report.html --reporter-htmlextra-logs

      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/report.html